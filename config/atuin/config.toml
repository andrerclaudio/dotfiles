# Atuin settings; anything not set here uses the default.
timezone = "local"
auto_sync = true
update_check = true
update_channel = "stable"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
style = "auto"
inline_height = 0
enter_accept = true
search_mode = "daemon-fuzzy"

[daemon]
enabled = true
autostart = true

[theme]
name = "gruvbox"
