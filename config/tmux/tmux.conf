# extra.sh copies this to ~/.config/tmux/. Plugins install with 'prefix + I'.

# Colors adjust (TrueColor support for tmux 3.2+ and Alacritty/Ghostty)
set-option -a terminal-features ',*:RGB'
set-option -sa terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:Tc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'

set -g @tmux-gruvbox 'dark'
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g renumber-windows on       # renumber all windows when any window is closed
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g status-position top
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
